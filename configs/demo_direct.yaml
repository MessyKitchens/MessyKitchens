# Tiny CPU configuration for the generated demo dataset.
workflow:
  backend: direct

model:
  feature_dim: 8
  input_dim: 8
  num_heads: 2
  mlp_hidden_dim: 32
  pose_head_hidden_dim: 16
  dropout: 0.0
  num_layers: 1
  use_global_attn: true
  use_layer_norm: true
  use_shape_tokens: true

train:
  # scripts/demo.sh train supplies the generated manifest with a dot-list override.
  data_json: null
  epochs: 10
  seed: 17
  precision: fp32
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  save_freq: 0
  loss_weights:
    translation: 1.0
    rotation: 1.0
    scale: 1.0

val:
  data_json: null
  max_val_scenes: null

optimizer:
  name: adamw
  lr: 0.005
  betas: [0.9, 0.999]
  weight_decay: 0.0
  eps: 1.0e-8

lr_scheduler:
  name: cosine_warmup
  num_warmup_steps: 0
