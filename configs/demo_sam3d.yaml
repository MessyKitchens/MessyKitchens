# Small SAM3D-backed MOD model for the bundled scene, not the paper checkpoint.
# All cached features and the SAM3D decoder retain their original dimensions.
workflow:
  backend: sam3d
model:
  feature_dim: 1024
  input_dim: 1024
  reduced_dim: 64
  num_heads: 4
  mlp_hidden_dim: 256
  dropout: 0.0
  num_layers: 1
  use_global_attn: true
  use_layer_norm: true
  use_shape_tokens: true
train:
  data_json: null
  epochs: 10
  seed: 17
  precision: fp32
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  save_freq: 0
  objective:
    profile: paper
    scale_loss: raw_mse
    chamfer:
      enabled: true
      backend: pytorch3d
      canonical_source: auto
      canonical_point_count: 4096
      num_samples: 1024
      sampling_seed: 17
      cache_size: 2
  loss_weights:
    translation: 100.0
    rotation: 0.1
    scale: 100.0
    cd: 100.0
val:
  data_json: null
optimizer:
  name: adamw
  lr: 0.00001
  betas: [0.9, 0.999]
  weight_decay: 0.05
  eps: 0.00000001
lr_scheduler:
  name: cosine_warmup
  num_warmup_steps: 0
