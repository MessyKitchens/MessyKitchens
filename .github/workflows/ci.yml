name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-release-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "${script}"
          done < <(find . -path './.git' -prune -o -type f -name '*.sh' -print0)

      - name: Check release hygiene
        run: python scripts/dev/check_release.py .

      - name: Install CPU test and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            torch==2.5.1 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,iou,test]'
          python -m pip install build twine
          python -m pip check

      - name: Run CPU tests
        run: python -m pytest -p no:cacheprovider -q

      - name: Lint Python
        run: python -m ruff check --no-cache .

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*
